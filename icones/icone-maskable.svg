<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Version « maskable » pour Android : fond plein (sans coins arrondis) et dessin réduit
       au centre, pour qu'Android puisse découper l'icône en rond sans couper le tampon. -->
  <rect width="100" height="100" fill="#ec8a72"/>
  <g transform="translate(15 15) scale(0.7)">
    <g transform="rotate(-8 46 48)">
      <path d="M16 30h60v11a7 7 0 0 0 0 14v11H16V55a7 7 0 0 0 0-14z" fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
      <path d="M38 40a8 8 0 1 1 11 7c-3 1.5-4 3-4 6" fill="none" stroke="#111" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="45" cy="61" r="3.2" fill="#111"/>
    </g>
    <circle cx="78" cy="78" r="13" fill="#111"/>
    <circle cx="78" cy="78" r="9" fill="none" stroke="#FAC775" stroke-width="2" stroke-dasharray="3 2"/>
    <circle cx="78" cy="78" r="3" fill="#FAC775"/>
  </g>
</svg>
