<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <!-- Icône de l'appli — style « Affiche + soleil de fond ».

       Le petit ruban crème (signet) qui pend du haut = ma signature, commune à mes applis.

       Version « maskable » : dessin rapproché du centre, pour qu'Android ne coupe rien. -->

  <defs>

    <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4826e"/><stop offset="1" stop-color="#d05941"/></linearGradient>

    <clipPath id="cadre"><rect width="100" height="100"/></clipPath>

  </defs>

  <g clip-path="url(#cadre)">

    <rect width="100" height="100" fill="url(#degrade)"/>

    <circle cx="64" cy="38" r="40" fill="#ea9c8c" opacity=".55"/>

    <g transform="translate(-8 2) scale(1.1)"><g transform="rotate(-8 46 48)"><path d="M16 30h60v11a7 7 0 0 0 0 14v11H16V55a7 7 0 0 0 0-14z" fill="#FFF6E6"/><path d="M38 40a8 8 0 1 1 11 7c-3 1.5-4 3-4 6" fill="none" stroke="#7a3426" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 57.8a3.2 3.2 0 1 0 .01 0z" fill="#7a3426"/></g></g>

    <path d="M68 0h12v30l-6-5-6 5z" fill="#000" opacity=".2" transform="translate(1.5 1.5)"/>

    <path d="M68 0h12v30l-6-5-6 5z" fill="#FFF6E6"/>

  </g>

</svg>