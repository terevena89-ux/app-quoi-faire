<script>
  // Thème choisi sur cet appareil, appliqué avant l'affichage pour éviter un flash.
  // « auto » (par défaut) : Suisse si l'appareil est en clair, Suisse nuit s'il est en sombre.
  (function () {
    var choix = 'auto';
    try { choix = localStorage.getItem('qf-theme') || 'auto'; } catch (e) { /* stockage bloqué */ }
    var sombre = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    // « journal » : Journal le jour, Journal nuit le soir (même principe)
    document.documentElement.dataset.theme = choix === 'auto' ? (sombre ? 'suissenuit' : 'suisse')
      : choix === 'journal' ? (sombre ? 'suissejournalnuit' : 'suissejournal') : choix;
  })();
</script>
